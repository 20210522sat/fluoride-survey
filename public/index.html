<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>牙膏氟濃度問卷調查</title>
<style>
  :root{
    --bg:#f5f3ef;
    --card:#ffffff;
    --accent:#2f7a5f;
    --accent-dark:#20573f;
    --text:#2b2b2b;
    --muted:#767267;
    --border:#e2ded4;
  }
  *{box-sizing:border-box;}
  body{
    margin:0;
    font-family:"Noto Sans TC","PingFang TC","Microsoft JhengHei",sans-serif;
    background:var(--bg);
    color:var(--text);
    padding:24px 16px 80px;
  }
  .wrap{max-width:720px;margin:0 auto;}
  header{text-align:center;margin-bottom:28px;}
  header h1{font-size:1.5rem;margin:0 0 6px;color:var(--accent-dark);}
  header p{margin:0;color:var(--muted);font-size:0.95rem;}
  .card{
    background:var(--card);
    border:1px solid var(--border);
    border-radius:14px;
    padding:22px 20px;
    margin-bottom:18px;
    box-shadow:0 2px 8px rgba(0,0,0,0.03);
  }
  .q-label{
    font-weight:700;font-size:1.05rem;margin-bottom:14px;
    display:flex;gap:8px;align-items:flex-start;
  }
  .q-num{
    background:var(--accent);color:#fff;width:26px;height:26px;
    border-radius:50%;display:flex;align-items:center;justify-content:center;
    font-size:0.85rem;flex:none;
  }
  input[type=text]{
    width:100%;padding:12px 14px;border:1px solid var(--border);
    border-radius:10px;font-size:1rem;font-family:inherit;
  }
  input[type=text]:focus{outline:2px solid var(--accent);border-color:var(--accent);}
  .options{display:flex;flex-direction:column;gap:10px;}
  .opt-row{
    display:flex;align-items:center;gap:10px;border:1px solid var(--border);
    border-radius:10px;padding:12px 14px;cursor:pointer;
    transition:border-color .15s, background .15s;
  }
  .opt-row:hover{border-color:var(--accent);}
  .opt-row.selected{border-color:var(--accent);background:#eef6f1;}
  .opt-row input{accent-color:var(--accent);width:18px;height:18px;flex:none;}
  .opt-row label{cursor:pointer;flex:1;font-size:1rem;}
  .img-grid{
    display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:12px;
  }
  .img-grid.img-grid-lg{
    grid-template-columns:repeat(auto-fit,minmax(230px,1fr));
    gap:16px;
  }
  .img-grid.img-grid-lg .img-opt img{
    min-height:150px;
    object-fit:cover;
  }
  .img-opt{
    border:2px solid var(--border);border-radius:12px;padding:8px;
    cursor:pointer;text-align:center;transition:border-color .15s, background .15s;
    position:relative;
  }
  .img-opt img{width:100%;height:auto;border-radius:8px;display:block;}
  .img-opt .tag{margin-top:6px;font-size:0.85rem;color:var(--muted);}
  .img-opt.selected{border-color:var(--accent);background:#eef6f1;}
  .img-opt.selected .tag{color:var(--accent-dark);font-weight:700;}
  .img-opt input{position:absolute;opacity:0;pointer-events:none;}
  .error{color:#c0392b;font-size:0.85rem;margin-top:8px;display:none;}
  .success-box{text-align:center;padding:40px 20px;}
  .success-box .check{
    width:64px;height:64px;border-radius:50%;background:var(--accent);color:#fff;
    display:flex;align-items:center;justify-content:center;margin:0 auto 16px;font-size:2rem;
  }
  .success-box h2{color:var(--accent-dark);margin-bottom:10px;}
  .success-box p{color:var(--muted);line-height:1.7;}
  .note-box{
    background:#fff8e6;border:1px solid #f0dfa6;border-radius:10px;
    padding:14px 16px;font-size:0.9rem;color:#7a5c00;margin-top:20px;line-height:1.7;
  }
  .progress-wrap{display:flex;align-items:center;gap:6px;margin-bottom:18px;}
  .progress-bar{flex:1;height:6px;background:var(--border);border-radius:4px;overflow:hidden;}
  .progress-fill{height:100%;background:var(--accent);border-radius:4px;transition:width .25s ease;}
  .progress-text{font-size:0.8rem;color:var(--muted);white-space:nowrap;flex:none;}
  .step{display:none;}
  .step.active{display:block;}
  button.next-btn{
    width:100%;padding:15px;background:var(--accent);color:#fff;border:none;
    border-radius:12px;font-size:1.05rem;font-weight:700;cursor:pointer;
    transition:background .15s;
  }
  button.next-btn:hover{background:var(--accent-dark);}
  button.next-btn:disabled{background:#b9c9bf;cursor:not-allowed;}
  .err-box{
    text-align:center;padding:20px;color:#c0392b;background:#fdecea;
    border:1px solid #f3c1bb;border-radius:10px;margin-top:16px;display:none;
  }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1>牙膏氟濃度衛教問卷調查</h1>
    <p>請您依自己的記憶填選即可</p>
  </header>

  <div class="progress-wrap">
    <div class="progress-bar"><div class="progress-fill" id="progressFill" style="width:25%;"></div></div>
    <div class="progress-text" id="progressText">第 1 題 / 共 4 題</div>
  </div>

  <form id="surveyForm">
    <div class="card step active" data-step="1">
      <div class="q-label"><span class="q-num">1</span>您的姓名</div>
      <input type="text" id="q1" name="q1" placeholder="請輸入您的姓名" autocomplete="off">
      <div class="error" id="err1">請填寫姓名</div>
      <button type="button" class="next-btn" id="nextBtn1" style="margin-top:16px;">下一題</button>
    </div>

    <div class="card step" data-step="2">
      <div class="q-label"><span class="q-num">2</span>您最記得的牙膏氟濃度是哪一個?</div>
      <div class="options" id="q2-options">
        <div class="opt-row" data-value="200 ppm"><input type="radio" name="q2" value="200 ppm" id="q2_0"><label for="q2_0">200 ppm</label></div>
        <div class="opt-row" data-value="500 ppm"><input type="radio" name="q2" value="500 ppm" id="q2_1"><label for="q2_1">500 ppm</label></div>
        <div class="opt-row" data-value="700 ppm"><input type="radio" name="q2" value="700 ppm" id="q2_2"><label for="q2_2">700 ppm</label></div>
        <div class="opt-row" data-value="900 ppm"><input type="radio" name="q2" value="900 ppm" id="q2_3"><label for="q2_3">900 ppm</label></div>
        <div class="opt-row" data-value="1450 ppm"><input type="radio" name="q2" value="1450 ppm" id="q2_4"><label for="q2_4">1450 ppm</label></div>
      </div>
      <div class="error" id="err2">請選擇一個選項</div>
    </div>

      <div class="q-label"><span class="q-num">3</span>您最記得哪一張圖?</div>

  <div id="successBox" class="card success-box" style="display:none;">
    <div class="check">&#10003;</div>
    <h2>感謝您的填答！</h2>
    <p>謝謝您的回覆，在實證醫學上最有證據力的齲齒預防方式為<br>
    「長牙開始就每天至少使用兩次含氟 1000 ppm 以上的牙膏」。</p>
  </div>

  <div class="note-box" id="noteBox" style="display:none;">
    本頁面所填寫的資料將儲存於問卷系統中，僅供本次調查彙整使用。
  </div>

  <div class="err-box" id="submitErrBox">送出失敗，請檢查網路連線後再試一次。</div>
</div>

<script>
const TOTAL_STEPS = 4;
let currentStep = 1;
const answers = { q1:null, q2:null, q3:null, q4:null };

function updateProgress(){
  document.getElementById('progressFill').style.width = (currentStep/TOTAL_STEPS*100) + '%';
  document.getElementById('progressText').textContent = `第 ${currentStep} 題 / 共 ${TOTAL_STEPS} 題`;
}

function goToStep(n){
  document.querySelectorAll('.step').forEach(s=>s.classList.remove('active'));
  const target = document.querySelector(`.step[data-step="${n}"]`);
  if(target) target.classList.add('active');
  currentStep = n;
  updateProgress();
  window.scrollTo({top:0, behavior:'smooth'});
}

async function finishSurvey(){
  document.getElementById('surveyForm').style.display = 'none';
  document.getElementById('submitErrBox').style.display = 'none';

  const record = {
    q1_name: answers.q1,
    q2_fluoride: answers.q2,
    q3_image: answers.q3,
    q4_image: answers.q4
  };

  try{
    const res = await fetch('/api/submit', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify(record)
    });
    if(!res.ok) throw new Error('submit failed');
    document.getElementById('successBox').style.display = 'block';
    document.getElementById('noteBox').style.display = 'block';
  }catch(err){
    console.error('submit error:', err);
    document.getElementById('submitErrBox').style.display = 'block';
    document.getElementById('surveyForm').style.display = 'block';
  }
}

document.getElementById('nextBtn1').addEventListener('click', ()=>{
  const val = document.getElementById('q1').value.trim();
  document.getElementById('err1').style.display = val ? 'none' : 'block';
  if(!val) return;
  answers.q1 = val;
  goToStep(2);
});
document.getElementById('q1').addEventListener('keydown', (e)=>{
  if(e.key === 'Enter'){ e.preventDefault(); document.getElementById('nextBtn1').click(); }
});

document.querySelectorAll('#q2-options .opt-row').forEach(row=>{
  row.addEventListener('click', ()=>{
    if(currentStep !== 2) return;
    row.querySelectorAll('input')[0].checked = true;
    row.parentElement.querySelectorAll('.opt-row').forEach(r=>r.classList.remove('selected'));
    row.classList.add('selected');
    answers.q2 = row.getAttribute('data-value');
    document.getElementById('err2').style.display = 'none';
    setTimeout(()=>goToStep(3), 200);
  });
});

document.querySelectorAll('#q3-options .img-opt').forEach(opt=>{
  opt.addEventListener('click', ()=>{
    if(currentStep !== 3) return;
    opt.querySelectorAll('input')[0].checked = true;
    opt.parentElement.querySelectorAll('.img-opt').forEach(o=>o.classList.remove('selected'));
    opt.classList.add('selected');
    answers.q3 = opt.getAttribute('data-value');
    document.getElementById('err3').style.display = 'none';
    setTimeout(()=>goToStep(4), 250);
  });
});

document.querySelectorAll('#q4-options .img-opt').forEach(opt=>{
  opt.addEventListener('click', ()=>{
    if(currentStep !== 4) return;
    opt.querySelectorAll('input')[0].checked = true;
    opt.parentElement.querySelectorAll('.img-opt').forEach(o=>o.classList.remove('selected'));
    opt.classList.add('selected');
    answers.q4 = opt.getAttribute('data-value');
    document.getElementById('err4').style.display = 'none';
    setTimeout(()=>finishSurvey(), 250);
  });
});

updateProgress();
</script>
